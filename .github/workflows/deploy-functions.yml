name: Deploy Firebase Functions

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: npm install
        working-directory: functions

      - name: Write .env
        run: |
          echo "WITHINGS_CLIENT_ID=${{ secrets.WITHINGS_CLIENT_ID }}" > functions/.env
          echo "WITHINGS_CLIENT_SECRET=${{ secrets.WITHINGS_CLIENT_SECRET }}" >> functions/.env

      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --only functions,firestore:rules --project frigochef-95045 --force

      - name: Allow public access to functions
        run: |
          for fn in withingsAuth withingsCallback withingsNotify; do
            gcloud functions add-iam-policy-binding $fn \
              --region=us-central1 \
              --member="allUsers" \
              --role="roles/cloudfunctions.invoker" \
              --project=frigochef-95045 || true
          done
