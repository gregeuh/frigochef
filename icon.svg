  <!-- leaf shape -->
  <path d="M368 540 C368 540 335 510 350 478 C365 446 400 452 400 452 C400 452 400 485 385 505 C376 516 368 540 368 540Z" fill="#00C47A"/>
  <path d="M368 540 C368 540 400 513 393 480 C386 448 352 448 352 448 C352 448 349 482 362 503 C370 517 368 540 368 540Z" fill="#00875A" opacity="0.7"/>
  <!-- stem -->
  <line x1="368" y1="540" x2="368" y2="558" stroke="#006644" stroke-width="5" stroke-linecap="round"/>
</svg>
