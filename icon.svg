    <stop offset="0%" stop-color="#00C47A" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#00875A" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- House body -->
  <path d="M512 260 L720 430 L720 730 L304 730 L304 430 Z" fill="white" opacity="0.97"/>

  <!-- Roof -->
